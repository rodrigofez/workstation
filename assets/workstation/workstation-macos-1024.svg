<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile-clip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <radialGradient id="tile" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#1b1c33"/>
      <stop offset="0.6" stop-color="#0c0d19"/>
      <stop offset="1" stop-color="#05060b"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7dff" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#5b4bd6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5b4bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#c4b5fd" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="fan" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="924" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
