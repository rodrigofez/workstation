      <path opacity="0.85" d="M40 402 C362 427 662 597 984 572 L984 622 C662 597 362 427 40 452Z"/>
      <path opacity="1" d="M40 482 C362 512 662 512 984 482 L984 542 C662 512 362 512 40 542Z"/>
      <path opacity="0.85" d="M40 572 C362 597 662 427 984 402 L984 452 C662 427 362 597 40 622Z"/>
      <path opacity="0.6" d="M40 663 C362 682 662 342 984 323 L984 361 C662 342 362 682 40 701Z"/>
      <path opacity="0.38" d="M40 753 C362 767 662 257 984 243 L984 271 C662 257 362 767 40 781Z"/>
