    <linearGradient id="beam-core" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="924" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
