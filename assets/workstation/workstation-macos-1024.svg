      <path d="M40 495.5 C362 498.5 662 525.5 984 522.5 L984 528.5 C662 525.5 362 498.5 40 501.5Z"/>
      <path d="M40 583.3 C362 585.8 662 438.3 984 435.8 L984 440.8 C662 438.3 362 585.8 40 588.3Z"/>
